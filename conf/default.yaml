expname: dng_mp20
# metadata specialised for each experiment
core:
  version: 0.0.1
  tags:
    - ${now:%Y-%m-%d}


defaults:
  - data: mp_20
  - logging: default
  - model: dng
  - optim: default
  - train: default
#    Decomment this parameter to get parallel job running
# - override hydra/launcher: joblib


hydra:
  run:
    dir: ${oc.env:HYDRA_JOBS}/singlerun/${now:%Y-%m-%d}/${expname}/

  sweep:
    dir: ${oc.env:HYDRA_JOBS}/multirun/${now:%Y-%m-%d}/${expname}/
    subdir: ${hydra.job.num}_${hydra.job.id}

  job:
    env_set:
      WANDB_START_METHOD: thread
      WANDB_DIR: ${oc.env:WANDB_DIR}
    
#    Decomment together with the hydra/launcher override above
#  launcher:
#    n_jobs: 1


