root_path: ${oc.env:PROJECT_ROOT}/data/mp_20
prop: eform_megnet
num_targets: 1
#prop: scaled_lattice
# num_targets: 6
niggli: true
primitive: False
graph_method: crystalnn
preprocess_workers: 30
readout: mean
max_atoms: 20
otf_graph: false
eval_model_name: mp20
scaling: true


train_max_epochs: 3000
early_stopping_patience: 500
teacher_forcing_max_epoch: 500


normalizer_dict: 
    pos: 1.0
    one_hot: 1.0
    types: 100


datamodule:
  _target_: symmbfn.data.datamodule.CrystDataModule

  datasets:
    train:
      _target_: symmbfn.data.dataset.CrystDataset
      name: Formation energy train
      path: ${data.root_path}/train_bg.csv
      save_path: ${data.root_path}/train_ori.pt
      prop: ${data.prop}
      niggli: ${data.niggli}
      primitive: ${data.primitive}
      graph_method: ${data.graph_method}
      preprocess_workers: ${data.preprocess_workers}
      data_augmentation: false
      scaling: ${data.scaling}

    val:
      - _target_: symmbfn.data.dataset.CrystDataset
        name: Formation energy val
        path: ${data.root_path}/val_bg.csv
        save_path: ${data.root_path}/val_ori.pt
        prop: ${data.prop}
        niggli: ${data.niggli}
        primitive: ${data.primitive}
        graph_method: ${data.graph_method}
        preprocess_workers: ${data.preprocess_workers}
        data_augmentation: False
        scaling: ${data.scaling}

    test:
      - _target_: symmbfn.data.dataset.CrystDataset
        name: Formation energy test
        path: ${data.root_path}/test_bg.csv
        save_path: ${data.root_path}/test_ori.pt
        prop: ${data.prop}
        niggli: ${data.niggli}
        primitive: ${data.primitive}
        graph_method: ${data.graph_method}
        preprocess_workers: ${data.preprocess_workers}
        data_augmentation: False
        scaling: false

  num_workers:
    train: 16
    val: 16
    test: 16

  batch_size:
    train: 256
    val: 256
    test: 256
